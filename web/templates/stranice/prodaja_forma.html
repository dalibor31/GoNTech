{{template "base" .}} {{define "naslov"}}Nova prodaja — NTech{{end}} {{define
"dodatni-css"}}
<style>
  .forma-kartica:nth-child(1) { animation-delay: 0.04s; }
  .forma-kartica:nth-child(2) { animation-delay: 0.12s; }
  @media (max-width: 768px) { .stavke-tabela-wrapper { display: none; } .stavke-kartice { display: flex !important; } }
  .polje-labela { font-size: 12px; color: var(--tekst-sporedni); display: block; margin-bottom: 4px; }
  .tip-klijenta-opcija {
    display: flex; align-items: center; gap: 5px;
    padding: 3px 10px; border: 1px solid var(--ivica); border-radius: 20px;
    cursor: pointer; font-size: 12px; color: var(--tekst-sporedni); user-select: none;
  }
  .tip-klijenta-opcija-akt { border-color: var(--akcentna); color: var(--tekst-glavni); background: var(--pozadina); }
  .klijent-stavka:last-child { border-bottom: none; }
  .klijent-stavka:hover { background: var(--pozadina); }
  [x-cloak] { display: none !important; }
</style>
{{end}} {{define "sadrzaj"}}

<script>
  var _ntechArtikli = {{.ArtikliJSON}};
  var _ntechKlijenti = {{.KlijentiJSON}};
  var _ntechPdvObveznik = {{if index .Moduli "pdv"}}true{{else}}false{{end}};
</script>

<div style="width: 100%" x-data="prodajaForma">
  <a href="/prodaja" class="nazad-link" hx-boost="true" hx-target="#glavni-sadrzaj" hx-select="#glavni-sadrzaj" hx-swap="outerHTML">
    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <polyline points="15 18 9 12 15 6" />
    </svg>
    Nazad na prodaju
  </a>

  <form method="POST" action="/prodaja/nova">
    <input type="hidden" name="_csrf" value="{{.CsrfToken}}" />
    {{if .Greska}}
    <div class="poruka-greska greska-animacija">{{.Greska}}</div>
    {{end}}

    <!-- zaglavlje prodaje -->
    <!-- position:relative + z-index: bez ovoga lista rezultata pretrage klijenata
         (position:absolute unutra) crta se ISPOD sledeće kartice (Stavke) — kartica
         bez pozicioniranja slika se u ranijoj fazi rasporeda bez obzira na z-index dece -->
    <div class="kartica forma-kartica animiraj" style="margin-bottom: 16px; position: relative; z-index: 2">
      <div style="margin-bottom: 16px; padding-bottom: 14px; border-bottom: 0.5px solid var(--ivica);">
        <span style="font-size: 16px; font-weight: 500; color: var(--tekst-glavni)">Nova prodaja</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 14px">
        <div class="forma-grid-2" style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
          <div>
            <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; flex-wrap: wrap; gap: 6px">
              <label class="polje-labela" style="margin-bottom: 0">Klijent</label>
              <div style="display: flex; gap: 6px">
                <label class="tip-klijenta-opcija" :class="klasaTipKlijenta('sve')" @click="postaviTipKlijenta('sve')">
                  <input type="radio" name="tip-klijenta-filter" value="sve" :checked="jeTipKlijenta('sve')" style="margin: 0" /> Sva lica
                </label>
                <label class="tip-klijenta-opcija" :class="klasaTipKlijenta('pravno')" @click="postaviTipKlijenta('pravno')">
                  <input type="radio" name="tip-klijenta-filter" value="pravno" :checked="jeTipKlijenta('pravno')" style="margin: 0" /> Pravna lica
                </label>
                <label class="tip-klijenta-opcija" :class="klasaTipKlijenta('fizicko')" @click="postaviTipKlijenta('fizicko')">
                  <input type="radio" name="tip-klijenta-filter" value="fizicko" :checked="jeTipKlijenta('fizicko')" style="margin: 0" /> Fizička lica
                </label>
              </div>
            </div>
            <input type="hidden" name="klijent_id" :value="izabraniKlijentId || ''" />
            <template x-if="izabraniKlijent">
              <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; padding: 8px 10px; background: var(--pozadina); border: 0.5px solid var(--ivica); border-radius: 8px">
                <div>
                  <div style="font-size: 13px; font-weight: 500; color: var(--tekst-glavni)" x-text="izabraniKlijent.naziv"></div>
                  <template x-for="p in poljaIzabranogKlijenta(izabraniKlijent)" :key="p.labela">
                    <div style="font-size: 11px; color: var(--tekst-sporedni)"><span x-text="p.labela"></span>: <span x-text="p.vrednost"></span></div>
                  </template>
                </div>
                <button type="button" class="btn-sekundarno" @click="ocistiKlijenta()" style="padding: 3px 10px; font-size: 12px">Promeni</button>
              </div>
            </template>
            <div x-show="!izabraniKlijent" style="position: relative" @click.outside="prikaziListuKlijenata = false">
              <input type="text" x-model="pretragaKlijent" autocomplete="off" @focus="pretragaKlijentPromenjena()" @input="pretragaKlijentPromenjena()" placeholder="Pretraži klijenta ili ostavi prazno..." style="width: 100%" />
              <div x-show="prikaziListuKlijenata && filtriraniKlijenti.length" x-cloak @scroll="ucitajViseKlijenata($event)" style="position: absolute; z-index: 30; left: 0; right: 0; margin-top: 4px; background: var(--pozadina); border: 0.5px solid var(--ivica); border-radius: 10px; max-height: 220px; overflow: auto; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.14)">
                <template x-for="k in filtriraniKlijenti" :key="k.id">
                  <div @click="izaberiKlijenta(k)" class="klijent-stavka" style="padding: 8px 12px; cursor: pointer; border-bottom: 0.5px solid var(--ivica)">
                    <div style="font-size: 13px; font-weight: 500; color: var(--tekst-glavni)" x-text="k.naziv"></div>
                    <div style="font-size: 11px; color: var(--tekst-sporedni)" x-text="detaljKlijenta(k)"></div>
                  </div>
                </template>
                <div x-show="imaJosKlijenata" style="padding: 6px 12px; text-align: center; font-size: 11px; color: var(--tekst-sporedni)">Skrolujte za još rezultata...</div>
              </div>
            </div>
          </div>
          <div style="display: flex; flex-direction: column; justify-content: flex-end">
            <label class="polje-labela">Način plaćanja</label>
            <select name="nacin_placanja" style="width:100%;">
              <option value="gotovina">Gotovina</option>
              <option value="kartica">Platna kartica</option>
              <option value="prenos">Bankarski prenos</option>
            </select>
          </div>
        </div>
        <div>
          <label class="polje-labela">Napomena</label>
          <textarea name="napomena" rows="2" placeholder="Interna napomena o prodaji..." style="width: 100%; resize: vertical"></textarea>
        </div>
      </div>
    </div>

    <!-- stavke -->
    <div class="kartica forma-kartica animiraj" style="margin-bottom: 16px">
      <div style="margin-bottom: 16px; padding-bottom: 14px; border-bottom: 0.5px solid var(--ivica); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px;">
        <span style="font-size: 16px; font-weight: 500; color: var(--tekst-glavni)">Stavke</span>
        <button type="button" @click="dodajStavku()" class="btn-primarno" style="font-size: 13px; padding: 6px 14px">
          + Dodaj stavku
        </button>
      </div>

      <!-- pretraga artikala -->
      <div style="margin-bottom:12px;">
        <input type="text" x-model="pretragaArtikal" placeholder="Pretraži artikle po nazivu, šifri ili barkodu..." style="width:100%;">
      </div>

      <!-- desktop tabela stavki -->
      <div class="stavke-tabela-wrapper" style="overflow-x: auto">
        <table class="tabela">
          <thead>
            <tr style="border-bottom: 0.5px solid var(--ivica)">
              <th style="padding: 8px 10px; text-align: left; font-size: 12px; font-weight: 500; color: var(--tekst-sporedni);">Artikal</th>
              <th style="padding: 8px 10px; text-align: center; font-size: 12px; font-weight: 500; color: var(--tekst-sporedni); width: 90px;">Kol.</th>
              <th style="padding: 8px 10px; text-align: right; font-size: 12px; font-weight: 500; color: var(--tekst-sporedni); width: 130px;">Cena/kom</th>
              <th style="padding: 8px 10px; text-align: right; font-size: 12px; font-weight: 500; color: var(--tekst-sporedni); width: 80px;">Popust%</th>
              <th style="padding: 8px 10px; text-align: right; font-size: 12px; font-weight: 500; color: var(--tekst-sporedni); width: 110px;">Ukupno</th>
              <th style="width: 40px;"></th>
            </tr>
          </thead>
          <tbody>
            <template x-for="(stavka, i) in stavke" :key="i">
              <tr style="border-bottom: 0.5px solid var(--ivica)">
                <td style="padding: 8px 10px;">
                  <input type="hidden" :name="'pdv_stopa[]'" :value="stavka.pdv_stopa">
                  <select :name="'artikal_id[]'" x-model="stavka.artikal_id" @change="popuniCenu(stavka)" :disabled="isMobile" style="width: 100%">
                    <option value="">— odaberi artikal —</option>
                    <template x-for="a in filtriraniArtikli" :key="a.id">
                      <option :value="a.id" x-text="a.naziv + (a.kategorija_naziv ? ' [' + a.kategorija_naziv + ']' : '')"></option>
                    </template>
                  </select>
                  <div x-show="stavka.kategorija_naziv" style="font-size:11px;color:var(--tekst-sporedni);margin-top:2px;" x-text="stavka.kategorija_naziv"></div>
                </td>
                <td style="padding: 8px 10px">
                  <input type="number" :name="'kolicina[]'" x-model="stavka.kolicina" min="1" :disabled="isMobile"
                    :style="prekoracenje(i) ? 'border-color:#dc2626;' : ''" style="width: 100%; text-align: center" />
                  <div x-show="stavka.artikal_id" :style="prekoracenje(i) ? 'color:#dc2626' : 'color:var(--tekst-sporedni)'"
                    x-text="'Na stanju: ' + dostupnaKolicina(i)" style="font-size: 11px; margin-top: 3px; text-align: center; white-space: nowrap;"></div>
                  <div x-show="prekoracenje(i)" style="font-size: 11px; color: #dc2626; margin-top: 1px; text-align: center; white-space: nowrap;">Prekoračena količina</div>
                </td>
                <td style="padding: 8px 10px">
                  <div style="display:flex;flex-direction:column;gap:2px;">
                    <input type="number" :name="'cena_po_komadu[]'" x-model="stavka.cena" min="0" step="0.01" :disabled="isMobile" style="width: 100%; text-align: right" />
                    <span x-show="pdvObveznik && stavka.pdv_stopa > 0" style="font-size:10px;color:var(--tekst-sporedni);text-align:right;" x-text="'+PDV ' + stavka.pdv_stopa + '%'"></span>
                  </div>
                </td>
                <td style="padding: 8px 10px">
                  <input type="number" :name="'popust[]'" x-model="stavka.popust" min="0" max="100" step="0.01" :disabled="isMobile" style="width: 100%; text-align: right" />
                </td>
                <td style="padding: 8px 10px; text-align: right; font-size: 14px; font-weight: 500; color: var(--tekst-glavni);">
                  <span x-text="fmtDin(ukupnoStavke(stavka)) + ' din'"></span>
                </td>
                <td style="padding: 8px 10px; text-align: center">
                  <button type="button" @click="ukloniStavku(i)" x-show="stavke.length > 1"
                    style="background: none; border: none; cursor: pointer; color: #dc2626; font-size: 18px; line-height: 1; padding: 2px 6px; border-radius: 4px; transition: background 0.15s;"
                    onmouseover="this.style.background = 'rgba(220,38,38,0.08)'" onmouseout="this.style.background = 'none'" title="Ukloni stavku">×</button>
                </td>
              </tr>
            </template>
          </tbody>
          <tfoot>
            <tr style="border-top: 0.5px solid var(--ivica)">
              <td colspan="4" style="padding: 10px; text-align: right; font-size: 13px; color: var(--tekst-sporedni); font-weight: 500;">Ukupno:</td>
              <td style="padding: 10px; text-align: right; font-size: 15px; font-weight: 600; color: var(--tekst-glavni);">
                <span x-text="fmtDin(ukupnoSvega()) + ' din'"></span>
              </td>
              <td></td>
            </tr>
          </tfoot>
        </table>
      </div>

      <!-- mobilne kartice stavki -->
      <div class="stavke-kartice" style="display: none; flex-direction: column; gap: 10px">
        <!-- pretraga na mobilnom -->
        <input type="text" x-model="pretragaArtikal" placeholder="Pretraži artikle..." style="width:100%;">
        <template x-for="(stavka, i) in stavke" :key="i">
          <div style="border: 0.5px solid var(--ivica); border-radius: 8px; padding: 12px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
              <span style="font-size: 13px; font-weight: 500; color: var(--tekst-sporedni);" x-text="'Stavka ' + (i + 1)"></span>
              <button type="button" @click="ukloniStavku(i)" x-show="stavke.length > 1"
                style="background: none; border: 0.5px solid #dc2626; color: #dc2626; cursor: pointer; font-size: 13px; padding: 2px 8px; border-radius: 4px;">Ukloni</button>
            </div>
            <div style="display: flex; flex-direction: column; gap: 10px">
              <input type="hidden" :name="'pdv_stopa[]'" :value="stavka.pdv_stopa">
              <!-- kategorija badge -->
              <div x-show="stavka.kategorija_naziv" style="font-size:11px;color:var(--tekst-sporedni);background:var(--pozadina);padding:2px 8px;border-radius:4px;align-self:flex-start;" x-text="stavka.kategorija_naziv"></div>
              <div>
                <label class="polje-labela">Artikal</label>
                <select :name="'artikal_id[]'" x-model="stavka.artikal_id" @change="popuniCenu(stavka)" :disabled="!isMobile" style="width: 100%">
                  <option value="">— odaberi artikal —</option>
                  <template x-for="a in filtriraniArtikli" :key="a.id">
                    <option :value="a.id" x-text="a.naziv"></option>
                  </template>
                </select>
              </div>
              <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
                <div>
                  <label class="polje-labela">Količina</label>
                  <input type="number" :name="'kolicina[]'" x-model="stavka.kolicina" min="1" :disabled="!isMobile"
                    :style="prekoracenje(i) ? 'border-color:#dc2626;' : ''" style="width: 100%" />
                  <div x-show="stavka.artikal_id" :style="prekoracenje(i) ? 'color:#dc2626' : 'color:var(--tekst-sporedni)'"
                    x-text="'Na stanju: ' + dostupnaKolicina(i)" style="font-size: 11px; margin-top: 3px;"></div>
                </div>
                <div>
                  <label class="polje-labela">Cena/kom (din)</label>
                  <input type="number" :name="'cena_po_komadu[]'" x-model="stavka.cena" min="0" step="0.01" :disabled="!isMobile" style="width: 100%" />
                </div>
              </div>
              <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
                <div>
                  <label class="polje-labela">Popust %</label>
                  <input type="number" :name="'popust[]'" x-model="stavka.popust" min="0" max="100" step="0.01" :disabled="!isMobile" style="width: 100%" />
                </div>
                <div style="text-align: right; font-size: 14px; font-weight: 500; color: var(--tekst-glavni);">
                  <span x-text="fmtDin(ukupnoStavke(stavka)) + ' din'"></span>
                </div>
              </div>
            </div>
          </div>
        </template>
        <div style="text-align: right; font-size: 15px; font-weight: 600; color: var(--tekst-glavni); padding: 8px 4px;">
          Ukupno: <span x-text="fmtDin(ukupnoSvega()) + ' din'"></span>
        </div>
      </div>
    </div>

    <!-- dugmad forme -->
    <div style="display: flex; justify-content: flex-end; gap: 10px">
      <a hx-boost="true" hx-target="#glavni-sadrzaj" hx-select="#glavni-sadrzaj" hx-swap="outerHTML" href="/prodaja" class="btn-sekundarno">Odustani</a>
      <button type="submit" class="btn-primarno" :disabled="imaPrekoracenja()" :style="imaPrekoracenja() ? 'opacity:0.4;cursor:not-allowed;' : ''">
        Sačuvaj prodaju
      </button>
    </div>
  </form>
</div>
{{end}}
