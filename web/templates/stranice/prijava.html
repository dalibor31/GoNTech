<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prijava — NTech</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0f1117;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .kartica {
            background: #1a1d2e;
            border: 0.5px solid #2a2d3e;
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 380px;
        }
        .logo {
            text-align: center;
            margin-bottom: 32px;
        }
        .logo-naziv {
            font-size: 22px;
            font-weight: 600;
            color: #fff;
            letter-spacing: -0.3px;
        }
        .logo-podnazlov {
            font-size: 13px;
            color: #6b7280;
            margin-top: 4px;
        }
        h1 {
            font-size: 18px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 24px;
        }
        .polje { margin-bottom: 16px; }
        label {
            display: block;
            font-size: 13px;
            color: #9ca3af;
            margin-bottom: 6px;
        }
        input {
            width: 100%;
            padding: 10px 14px;
            background: #0f1117;
            border: 0.5px solid #2a2d3e;
            border-radius: 8px;
            font-size: 14px;
            color: #fff;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus { border-color: #4f7ef8; }
        .dugme {
            width: 100%;
            padding: 11px;
            background: #4f7ef8;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            margin-top: 8px;
            transition: opacity 0.2s;
        }
        .dugme:hover { opacity: 0.88; }
        .greska {
            background: #fef2f2;
            border: 0.5px solid #fca5a5;
            color: #dc2626;
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 13px;
            margin-bottom: 20px;
        }
        .uspeh {
            background: #f0fdf4;
            border: 0.5px solid #86efac;
            color: #16a34a;
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 13px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="kartica">
        <div class="logo">
            <div class="logo-naziv">NTech</div>
            <div class="logo-podnazlov">Sistem za upravljanje</div>
        </div>

        <h1>Prijava</h1>

        {{if eq .Greska "1"}}
        <div class="greska">Pogrešno korisničko ime ili lozinka.</div>
        {{else if eq .Greska "2"}}
        <div class="greska">Greška na serveru. Pokušajte ponovo.</div>
        {{end}}

        {{if .Sacuvano}}
        <div class="uspeh">Nalog je kreiran. Možete se prijaviti.</div>
        {{end}}

        <form method="POST" action="/prijava">
            <div class="polje">
                <label for="korisnicko_ime">Korisničko ime</label>
                <input type="text" id="korisnicko_ime" name="korisnicko_ime"
                    autocomplete="username" autofocus required>
            </div>
            <div class="polje">
                <label for="lozinka">Lozinka</label>
                <input type="password" id="lozinka" name="lozinka"
                    autocomplete="current-password" required>
            </div>
            <button type="submit" class="dugme">Prijavi se</button>
        </form>
    </div>
</body>
</html>
